<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>대회 진행 타이머</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: iPad mini landscape (1133x744). Left = clock + stopwatch (resizable) over program list with progress. Right = stage/mic/camera plan for the selected program + next-program countdown. */
:root {
  --bg: #12161a; --panel: #1a2026; --panel2: #212931; --line: #2e3841; --fg: #e9eef1; --mute: #8d9aa4;
  --accent: #f0b43c; --accent-dim: #4a3a14; --ok: #52c4a4; --warn: #ef6a5b; --left: #6fa8f0; --right: #c58af0;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --sans: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --done: #1f2a26; --selbg: rgba(255,255,255,.04); --scr1: #161c21; --scr2: #1a2127; --dot: #5a6773; --onacc: #1b1405;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e9edf1; --panel: #ffffff; --panel2: #f2f5f8; --line: #d3dae0; --fg: #1b232a; --mute: #5b6872;
  --accent: #c47f00; --accent-dim: #f8e4b8; --ok: #17866a; --warn: #d4422f; --left: #2b69c0; --right: #8445c4;
  --done: #e2efe9; --selbg: rgba(0,0,0,.045); --scr1: #e6ebef; --scr2: #dde3e8; --dot: #9aa6b0; --onacc: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg); color: var(--fg); font: 400 15px/1.35 var(--sans);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 12px; }
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; }

/* ---------- left ---------- */
.top { flex: 0 0 var(--topH, 32%); min-height: 120px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.clockrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.clock { font: 600 clamp(40px, 8.4vh, 70px)/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; white-space: nowrap; }
.clock .ap { font: 700 .36em var(--sans); color: var(--accent); margin-right: 8px; letter-spacing: 0; }
.meta { text-align: right; color: var(--mute); font-size: 13px; }
.demo { margin-top: 4px; padding: 4px 10px; border-radius: 99px; background: var(--panel2); color: var(--accent); font-size: 12px; border: 1px solid var(--line); }
.mbtns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 6px; }
.mbtns .demo { white-space: nowrap; }
.demo.fsb { color: var(--fg); }
.demo[aria-pressed="false"] { color: var(--mute); }
.swrow { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.swlabel { min-width: 0; flex: 1 1 auto; font-size: 13px; color: var(--mute); }
.swlabel b { display: block; color: var(--fg); font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw { font: 600 clamp(30px, 6.4vh, 50px)/1 var(--mono); font-variant-numeric: tabular-nums; }
.sw.over { color: var(--warn); }
.sw.run { color: var(--accent); }
.btns { display: flex; gap: 8px; }
.btn { height: 44px; min-width: 76px; border-radius: 8px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
.btn.go { background: var(--accent); color: var(--onacc); border-color: var(--accent); }
.btn.stop { background: var(--warn); color: #1d0907; border-color: var(--warn); }
.swbar { height: 5px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.swbar i { display: block; height: 100%; width: 0; background: var(--accent); }

.split { flex: 0 0 18px; display: grid; place-items: center; cursor: row-resize; touch-action: none; }
.split::before { content: ""; width: 64px; height: 5px; border-radius: 3px; background: var(--line); }
.split:active::before, .split:focus-visible::before { background: var(--accent); }

.list { flex: 1 1 0; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 8px 8px 0; }
.tab { flex: 1 1 0; padding: 8px 4px; border-radius: 7px 7px 0 0; background: transparent; color: var(--mute); font-weight: 500; font-size: 14px; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--panel2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.sess { padding: 6px 12px; font-size: 12px; color: var(--mute); background: var(--panel2); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
.grp { padding: 6px 12px 4px; font-size: 12px; color: var(--accent); letter-spacing: .04em; background: var(--bg); border-top: 1px solid var(--line); }
.row { position: relative; width: 100%; text-align: left; display: grid; grid-template-columns: 84px 40px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 8px 12px; background: transparent; border-top: 1px solid var(--line); overflow: hidden; }
.row .fill { position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: var(--accent-dim); }
.row.done .fill { background: var(--done); }
.row > :not(.fill) { position: relative; }
.row .t { font: 600 14.5px var(--mono); font-variant-numeric: tabular-nums; }
.row .t i { font: 500 11px var(--sans); font-style: normal; color: var(--mute); margin-right: 3px; }
.row .l { font-size: 12px; color: var(--mute); }
.row .n { font-weight: 700; font-size: 15px; line-height: 1.25; }
.row .s { font-size: 12.5px; color: var(--mute); }
.row .pc { font: 600 14px var(--mono); color: var(--accent); min-width: 42px; text-align: right; }
.row.done { color: var(--mute); }
.row.done .pc { color: var(--ok); }
.row.cur { box-shadow: inset 4px 0 0 var(--accent); }
.row.sel { background: var(--selbg); }
.row.sel::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: var(--fg); }

/* ---------- right ---------- */
.right { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.rbody { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
.g2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; align-items: start; }
.shh { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
.mons { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 6px 12px; }
.mons .mg { display: grid; grid-template-columns: minmax(0,1fr) 48px minmax(0,1fr); gap: 6px; align-items: center; }
.mons .mc { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: var(--mute); text-align: center; line-height: 1.15; }
.mon { min-width: 0; display: flex; align-items: center; gap: 8px; }
.mon.R { flex-direction: row-reverse; text-align: right; }
.mon .tx { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--mute); line-height: 1.25; }
.mon.R .tx { align-items: flex-end; }
.mon .tx b { font-size: 13px; font-weight: 700; }
.mon.L .tx b { color: var(--left); } .mon.R .tx b { color: var(--right); }
.mon .tx .cp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.mon .scr { position: relative; flex: none; height: 56px; aspect-ratio: 16/9; border: 3px solid var(--line); border-radius: 6px; background: repeating-linear-gradient(135deg, var(--scr1) 0 8px, var(--scr2) 8px 16px); display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
.mon.L .scr { border-color: color-mix(in srgb, var(--left) 60%, var(--line)); }
.mon.R .scr { border-color: color-mix(in srgb, var(--right) 60%, var(--line)); }
.mon .scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.mon .scr .ph0 { font-size: 14px; font-weight: 700; color: var(--fg); line-height: 1.25; padding: 0 4px; }
.mon .dots { display: flex; gap: 3px; }
.mon.R .dots { justify-content: flex-end; }
.mon .dots i { width: 12px; height: 4px; border-radius: 2px; background: var(--line); }
.mon .dots i.on { background: var(--accent); }
.mon .dots i.done { background: var(--dot); }
.stagebox svg { max-height: 104px; }
.foot { flex: none; border-top: 1px solid var(--line); background: var(--panel2); padding: 10px 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: center; }
.nx { all: unset; cursor: pointer; display: block; min-width: 0; }
.nx .n { font-weight: 700; font-size: 15px; line-height: 1.3; }
.nx .s, .cd .s { font-size: 12.5px; color: var(--mute); }
.cd { text-align: right; }
.cd .big { font: 600 34px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); }
.cd .big.low { color: var(--warn); }
.cdbar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.cdbar i { display: block; height: 100%; }
.hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.hd h2 { margin: 0; font-size: 18px; line-height: 1.3; text-wrap: balance; }
.hd .k { font-size: 12px; color: var(--mute); margin-bottom: 2px; }
.pill { flex: none; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
.pill.live { background: var(--accent); color: var(--onacc); border-color: var(--accent); }
.sec { font-size: 12px; color: var(--mute); letter-spacing: .06em; margin-bottom: 6px; }
.people { display: grid; gap: 6px; }
.p { display: grid; grid-template-columns: auto minmax(0,1fr); grid-template-areas: "t n" "t m"; gap: 0 8px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.achip { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: var(--onacc); font-size: 11px; font-weight: 700; line-height: 1.5; }
.aud { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
.aud .ah { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.aud .ah b { color: var(--accent); }
.aud .ah span { font-size: 12px; color: var(--mute); }
.aud .ord { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.aud .ord span { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); }
.aud .ord .au { background: var(--accent); color: var(--onacc); border-color: var(--accent); }
.aud .ord .iv { color: var(--right); border-color: var(--right); }
.aud .ord .dm { color: var(--left); border-color: var(--left); }
.aud .ord em { font-style: normal; color: var(--mute); }
.aud .ai { display: grid; grid-template-columns: 62px minmax(0,1fr); gap: 8px; align-items: start; padding: 4px 6px; border-radius: 6px; }
.aud .ai .at { font: 600 13px var(--mono); color: var(--mute); }
.aud .ai .aq { font-size: 12.5px; line-height: 1.4; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.aud .ai .aq b { color: var(--fg); }
.aud .ai.nx { background: color-mix(in srgb, var(--accent) 18%, transparent); outline: 1px solid var(--accent); }
.aud .ai.nx .at { color: var(--accent); }
.aud .ai.nx .aq { color: var(--fg); -webkit-line-clamp: 4; }
.aud .ai.dn { opacity: .5; }
.sides { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; align-items: start; }
.sd { display: grid; gap: 6px; }
.sh { font-size: 12px; font-weight: 700; letter-spacing: .04em; padding-bottom: 2px; border-bottom: 2px solid var(--line); }
.sh.L { color: var(--left); border-color: var(--left); }
.sh.R { color: var(--right); border-color: var(--right); text-align: right; }
.sd.R .p { border-right: 3px solid var(--right); }
.sd.L .p { border-left: 3px solid var(--left); }
.p .nm { grid-area: n; font-weight: 700; font-size: 14px; }
.p .tag { grid-area: t; align-self: center; }
.p .cg { font-size: 12px; color: var(--mute); font-weight: 400; }
.tag { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); white-space: nowrap; }
.tag.L { color: var(--left); border-color: var(--left); }
.tag.R { color: var(--right); border-color: var(--right); }
.tag.C { color: var(--accent); border-color: var(--accent); }
.mic { grid-area: m; font-size: 11.5px; color: var(--mute); }
.mic.on { color: var(--ok); }
.box { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.box svg { display: block; width: 100%; height: auto; }
.cam { display: grid; gap: 6px; }
.ph { text-align: left; width: 100%; display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); }
.ph .at { font: 600 14px var(--mono); color: var(--mute); }
.ph b { display: block; font-size: 14px; }
.ph span { font-size: 12.5px; color: var(--mute); }
.ph .q { display: block; margin-top: 3px; font-size: 12px; color: var(--fg); opacity: .85; line-height: 1.35; }
.ph.pvw { border-color: var(--fg); }
.ph.act { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.ph.act .at { color: var(--accent); }
.note { font-size: 12.5px; color: var(--mute); }
.cue { font-size: 12.5px; color: var(--fg); background: var(--panel2); border: 1px dashed var(--line); border-radius: 8px; padding: 7px 10px; }
@media (prefers-reduced-motion: no-preference) { .row .fill { transition: width .6s linear; } }

/* ---------- compact (phone): clock + stopwatch + current program only ---------- */
.mini { display: none; flex-direction: column; justify-content: flex-start; gap: 10px; min-height: 0; min-width: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.mini .pill { align-self: flex-start; }
.mini h2 { margin: 0; font-size: 22px; line-height: 1.3; text-wrap: balance; }
.mini .m2 { font-size: 14px; color: var(--mute); }
.mini .m2 b { color: var(--fg); font-weight: 700; }
.mbar { height: 12px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--accent); }
.mrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--mute); }
.mrow .big { font: 600 34px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); }
.mrow .big.low { color: var(--warn); }
@media (max-width: 720px), (max-height: 500px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  #left { display: contents; }
  .split, .list, .right { display: none; }
  .top { flex: none; min-height: 0; gap: 10px; }
  .clock { font-size: min(13.5vw, 13vh, 64px); }
  .swrow { flex-wrap: wrap; row-gap: 6px; }
  .swlabel { flex: 1 1 100%; }
  .sw { font-size: min(13vw, 12vh, 48px); }
  .btns { margin-left: auto; }
  .mini { display: flex; }
}
@media ((max-width: 720px) or (max-height: 500px)) and (min-aspect-ratio: 1/1) {
  .app { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); }
}
.mini { gap: 12px; }
.mmain { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: flex-start; gap: 10px; }
.mmain::before, .mmain::after { content: ""; flex: 1 1 0; min-height: 0; }
.mtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mback { padding: 10px 14px; border-radius: 8px; background: var(--accent); color: var(--onacc); font-weight: 700; font-size: 14px; min-height: 44px; }
.mnext { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); }
.mnext b { font-size: 16px; line-height: 1.3; }
.mnext.end { color: var(--mute); }
.mncd { font: 600 20px/1.2 var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); margin-top: 2px; }
@media (max-width: 720px), (max-height: 500px) {
  .clockrow { flex-wrap: wrap; row-gap: 4px; }
  .meta { flex: 1 1 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; }
  #date { white-space: nowrap; }
  .demo { margin-top: 0; white-space: nowrap; }
}

.mtabs { flex: none; display: flex; gap: 4px; }
.mtab { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; min-height: 44px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); color: var(--mute); }
.mtab span { font-size: 11px; }
.mtab b { font-size: 13px; font-weight: 700; white-space: nowrap; }
.mtab[aria-selected="true"] { color: var(--fg); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.mini .pi { color: var(--fg); }
.mini .m3 { font-size: 13px; color: var(--mute); }
.mnext .pi { color: var(--fg); }
/* phone landscape: very little height, so everything is smaller and the right card scrolls if it still does not fit */
@media (max-height: 500px) and (orientation: landscape) {
  .app { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 8px; }
  body { padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
  .top { padding: 8px 10px; gap: 6px; }
  .clock { font-size: min(6vw, 16vh, 44px); }
  .clock .ap { margin-right: 4px; }
  .meta { font-size: 11px; }
  .demo { padding: 3px 8px; font-size: 11px; }
  .swlabel { font-size: 11px; }
  .swlabel b { font-size: 12px; }
  .sw { font-size: min(5.4vw, 12vh, 34px); }
  .btn { height: 36px; min-width: 54px; font-size: 13px; }
  .mini { padding: 8px 10px; gap: 6px; }
  .mtabs { gap: 3px; }
  .mtab { flex-direction: row; justify-content: center; gap: 3px; min-height: 30px; padding: 2px; }
  .mtab span { font-size: 10px; }
  .mtab b { font-size: 11px; }
  .mmain { gap: 4px; }
  .mmain::before, .mmain::after { display: none; }
  .mini h2 { font-size: 16px; }
  .mini .m2 { font-size: 12px; }
  .mini .m3 { display: none; }
  .mback { min-height: 32px; padding: 4px 10px; font-size: 12px; }
  .mrow { font-size: 11px; }
  .mrow .big { font-size: 24px; }
  .mbar { height: 8px; }
  .mnext { padding: 6px 10px; gap: 1px; }
  .mnext b { font-size: 14px; }
  .mnext .m2 { display: none; }
  .mncd { font-size: 15px; margin-top: 0; }
}
/* tablet portrait (iPad mini 세로): 한 줄로 쌓기 - 시계/스톱워치 → 현재 프로그램 정보 → 프로그램 목록 */
@media (min-width: 721px) and (orientation: portrait) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 21%); gap: 8px; }
  #left { display: contents; }
  .split { display: none; }
  .top { order: 1; flex: none; min-height: 0; gap: 8px; }
  .right { order: 2; }
  .list { order: 3; }
  .clock { font-size: clamp(44px, 9vw, 72px); }
  .sw { font-size: clamp(34px, 7vw, 52px); }
  .rbody { padding: 10px 12px; gap: 10px; }
  .stagebox svg { max-height: 92px; }
}
</style>
</head>
<body>
<div class="app">
  <section class="col" id="left">

  {l:'25일 오전 10:20', t:new Date(2026,9,25,10,20,0).getTime()},
  {l:'25일 오후 2:20', t:new Date(2026,9,25,14,20,0).getTime()}
];
var demoIdx=-1, demoBase=0, demoStart=0;
function now(){ return demoIdx>=0 ? demoBase+(Date.now()-demoStart) : Date.now(); }

var sel=0, pg='a1', follow=true, pv=null, scrollNeeded=true;
var sw={run:false,t0:0,acc:0};
function swMs(){ return sw.acc+(sw.run?Date.now()-sw.t0:0); }

function curIdx(){ var n=now(); for(var i=0;i<D.length;i++) if(n>=D[i].start&&n<D[i].end) return i; return -1; }
function nextIdx(){
  var ci=curIdx(), n=now(), i;
  if(ci>=0) return (ci+1<D.length && D[ci+1].day===D[ci].day) ? ci+1 : -1;
  for(i=0;i<D.length;i++) if(D[i].start>n) return i;
  return -1;
}
function pickSel(){ var ci=curIdx(); if(ci>=0) return ci; var ni=nextIdx(); return ni>=0?ni:D.length-1; }
function pageOf(k){ for(var i=0;i<PAGES.length;i++) if(PAGES[i].k===k) return PAGES[i]; return PAGES[0]; }

/* ---------------- tabs & list ---------------- */
function buildTabs(){
  $('tabs').innerHTML=PAGES.map(function(p){ return '<button class="tab" role="tab" data-k="'+p.k+'" aria-selected="false">'+p.tab+'</button>'; }).join('');
  $('tabs').onclick=function(e){
    var b=e.target.closest('.tab'); if(!b) return;
    var k=b.dataset.k, ci=curIdx(), first=-1, i;
    for(i=0;i<D.length;i++) if(D[i].pg===k){ first=i; break; }
    sel=(ci>=0&&D[ci].pg===k)?ci:first; follow=(sel===ci); pv=null;
    setPage(k); render(); tick(true);
  };
}
function setPage(k){
  pg=k;
  Array.prototype.forEach.call($('tabs').children,function(b){ b.setAttribute('aria-selected', b.dataset.k===k?'true':'false'); });
  $('sess').textContent=pageOf(k).theme;
  buildRows(); scrollNeeded=true;
}
function buildRows(){
  var h='';
  D.forEach(function(p,i){
    if(p.pg!==pg) return;
    if(p.grp) h+='<div class="grp">'+esc(p.grp)+'</div>';
    h+='<button class="row" data-i="'+i+'"><span class="fill"></span><span class="t">'+ktHtml(p.t)+'</span><span class="l">'+p.len+'분</span>'
     +'<span><span class="n">'+(p.no?p.no+'. ':'')+esc(p.title)+'</span><br><span class="s">'+(p.who?esc(p.who)+' · '+esc(p.cong):(p.mc?'사회 '+esc(p.mc):'&nbsp;'))+(p.aud?' <span class="achip">청중 참여 '+p.aud.items.length+'회</span>':'')+'</span></span><span class="pc"></span></button>';
  });
  $('rows').innerHTML=h;
  $('rows').onclick=function(e){ var b=e.target.closest('.row'); if(!b) return; sel=+b.dataset.i; follow=(sel===curIdx()); pv=null; render(); tick(true); };
}
function updateRows(){
  var n=now(), ci=curIdx(), selEl=null;
  Array.prototype.forEach.call($('rows').querySelectorAll('.row'),function(r){
    var i=+r.dataset.i,p=D[i],pr=Math.max(0,Math.min(1,(n-p.start)/(p.end-p.start)));
    r.style.setProperty('--p',(pr*100)+'%');
    r.classList.toggle('done',pr>=1); r.classList.toggle('cur',i===ci); r.classList.toggle('sel',i===sel);
    r.querySelector('.pc').textContent = pr>=1?'완료':(i===ci?Math.floor(pr*100)+'%':'');
    if(i===sel) selEl=r;
  });
  if(scrollNeeded && selEl){ $('rows').scrollTop=Math.max(0,selEl.offsetTop-60); scrollNeeded=false; }
}

/* ---------------- camera drawings ---------------- */
function person(x,hy,r,col,chair){
  var w=r*2.3, base=hy+r*3.4, s='';
  if(chair) s+='<rect x="'+(x-w*1.05)+'" y="'+(base-r*0.6)+'" width="'+(w*2.1)+'" height="'+(r*1.1)+'" rx="3" fill="#2e3841"/>';
  s+='<path d="M'+(x-w)+' '+base+' L'+(x-w)+' '+(hy+r*1.8)+' Q'+(x-w)+' '+(hy+r*1.25)+' '+x+' '+(hy+r*1.25)+' Q'+(x+w)+' '+(hy+r*1.25)+' '+(x+w)+' '+(hy+r*1.8)+' L'+(x+w)+' '+base+'Z" fill="'+col+'" opacity=".85"/>';
  s+='<circle cx="'+x+'" cy="'+hy+'" r="'+r+'" fill="#d3dbe0"/>';
  return s;
}
function tag(x,name,col){
  var w=Math.max(46,name.length*13+14);
  return '<rect x="'+(x-w/2)+'" y="154" width="'+w+'" height="20" rx="10" fill="#12161a" stroke="'+col+'"/><text x="'+x+'" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#e9eef1" font-family="Noto Sans KR, sans-serif">'+esc(name)+'</text>';
}
function shotSvg(p,ph){
  var k=ph.shot, Rr=p.ppl.filter(function(x){return x.side==='R';}), Ll=p.ppl.filter(function(x){return x.side==='L';});
  var C='#f0b43c', CL='#6fa8f0', CR='#c58af0', g='<rect x="1" y="1" width="318" height="178" rx="6" fill="#0e1215" stroke="#2e3841"/><rect x="2" y="120" width="316" height="58" fill="#161c21"/>';
  var who=p.who||p.mc;
  if(k===1){
    g+=person(160,62,30,'#7b8791')+'<rect x="95" y="112" width="130" height="68" rx="4" fill="#2e3841"/><text x="160" y="140" text-anchor="middle" font-size="12" fill="#8d9aa4" font-family="Noto Sans KR, sans-serif">연단</text>'+tag(160,who,C);
  } else if(k===2||k===3){
    var n=Rr.length, xs=(n===1)?[225]:[195,265], r=(n===1)?24:19, sx=(n===1)?100:75;
    g+=person(sx,70,r,'#7b8791')+'<rect x="'+(sx-45)+'" y="118" width="90" height="62" rx="4" fill="#2e3841"/>'+tag(sx,who,C);
    Rr.forEach(function(x,i){ g+=person(xs[i],74,r,CR)+tag(xs[i],x.n,CR); });
  } else {
    var m=Ll.length, lx=(m===3)?[40,100,160]:(m===2?[55,125]:[90]);
    Ll.forEach(function(x,i){ g+=person(lx[i],82,17,CL,true)+tag(lx[i],x.n,CL); });
    g+=person(262,78,13,'#7b8791')+'<rect x="232" y="112" width="60" height="68" rx="4" fill="#2e3841"/><text x="262" y="140" text-anchor="middle" font-size="11" fill="#8d9aa4" font-family="Noto Sans KR, sans-serif">연단</text>'+tag(262,who,C);
  }
  return '<svg viewBox="0 0 320 180" role="img" aria-label="카메라 화면 예시">'+g+'</svg>';
}
var KD={bg:'#12161a',line:'#2e3841',mute:'#8d9aa4',pod:'#2e3841',fg:'#e9eef1',acc:'#f0b43c',L:'#6fa8f0',R:'#c58af0',panel:'#1a2026'};
var KLt={bg:'#f2f5f8',line:'#c4ccd3',mute:'#5b6872',pod:'#c4ccd3',fg:'#1b232a',acc:'#c47f00',L:'#2b69c0',R:'#8445c4',panel:'#ffffff'};
function K(n){ return (document.documentElement.getAttribute('data-theme')==='light'?KLt:KD)[n]; }
function stageSvg(p){
  var L=p.ppl.filter(function(x){return x.side==='L';}).length, Rn=p.ppl.filter(function(x){return x.side==='R';}).length;
  var s='<svg viewBox="0 0 220 150" role="img" aria-label="무대 배치"><rect x="4" y="4" width="212" height="112" rx="6" fill="'+K("bg")+'" stroke="'+K("line")+'"/>';

  s+='<rect x="92" y="44" width="36" height="24" rx="3" fill="'+K("pod")+'"/><text x="110" y="60" text-anchor="middle" font-size="9" fill="'+K("fg")+'">연단</text><circle cx="110" cy="34" r="8" fill="'+K("acc")+'"/>';
  s+='<text x="40" y="38" text-anchor="middle" font-size="9" fill="'+K("L")+'">왼쪽 · 실연</text><text x="180" y="38" text-anchor="middle" font-size="9" fill="'+K("R")+'">오른쪽 · 회견</text>';
  for(var i=0;i<L;i++) s+='<circle cx="'+(24+i*18)+'" cy="76" r="8" fill="'+K("L")+'"/>';

  s+='<rect x="70" y="124" width="80" height="20" rx="4" fill="'+K("panel")+'" stroke="'+K("line")+'"/><text x="110" y="138" text-anchor="middle" font-size="9" fill="'+K("mute")+'">청중석 · 카메라</text></svg>';
  return s;

/* ---------------- stage monitors (left/right big screens) ----------------
   MONS[key] = { L:[{at:sec, src:'img/xx.png', cap:'설명'}], R:[...] }   key = page + '-' + program no (예: 'a1-3', 'b2-4')
   at = 프로그램 시작 후 몇 초에 이 삽화로 바뀌는지. src 가 없으면 '삽화 대기' 자리표시자가 보입니다. */
var MONS = {};
function monSlides(p, side){
  var k = p.pg+'-'+(p.no||'');
  if(MONS[k] && MONS[k][side]) return MONS[k][side];
  /* 자료가 올라오기 전: 자리표시자(모니터 기본 화면) */
  return [side==='L'?{at:0, label:'2026년 연표', cap:'2026년 연표', src:'img/yeartext.jpg'}:{at:0, label:'대회주제', cap:'대회주제', src:'img/theme.jpg'}];
}
function monCur(sl, e){ var a=0; sl.forEach(function(x,i){ if(e>=x.at) a=i; }); return a; }
function updateAud(){
  var A=$('aud'); if(!A) return;
  var p=D[sel], live=(sel===curIdx()), e=live?Math.max(0,(now()-p.start)/1000):-1, nx=-1;
  var its=A.querySelectorAll('.ai');
  if(live) for(var i=0;i<its.length;i++){ if(e<+its[i].dataset.at+45){ nx=i; break; } }
  Array.prototype.forEach.call(its,function(el,i){ el.classList.toggle('nx',live&&i===nx); el.classList.toggle('dn',live&&(nx<0||i<nx)); });
}
var monKey='';
function updateMons(){
  var B=$('mons'), p=D[sel];
  if(!p || p.brk){ B.style.display='none'; return; }
  B.style.display='';
  var key=sel+'|'+(p.pg), e=(sel===curIdx())?Math.max(0,(now()-p.start)/1000):0;
  if(monKey!==key){
    monKey=key;
    var h='<div class="mg">';
    ['L','R'].forEach(function(sd,i){
      h+='<div class="mon '+sd+'"><div class="scr" id="mscr'+sd+'"></div><div class="tx"><b>'+(sd==='L'?'왼쪽 모니터':'오른쪽 모니터')+'</b><span class="cp" id="mcap'+sd+'"></span><div class="dots" id="mdot'+sd+'"></div></div></div>';
      if(i===0) h+='<div class="mc"><svg width="30" height="22" viewBox="0 0 30 22"><rect x="1" y="2" width="9" height="12" rx="1.5" fill="none" stroke="#6fa8f0" stroke-width="1.5"/><rect x="20" y="2" width="9" height="12" rx="1.5" fill="none" stroke="#c58af0" stroke-width="1.5"/><rect x="12" y="8" width="6" height="8" rx="1" fill="#2e3841"/><path d="M3 20h24" stroke="#2e3841" stroke-width="2"/></svg><span id="mnote">무대</span></div>';
    });
    B.innerHTML=h+'</div>';
    B._last={L:-2,R:-2};
  }
  var tot=[];
  ['L','R'].forEach(function(sd){
    var sl=monSlides(p,sd), c=monCur(sl,e);
    tot.push(sl.length);
    if(B._last[sd]!==c){
      B._last[sd]=c;
      var x=sl[c], scr=$('mscr'+sd);
      scr.innerHTML=x.src?'<img src="'+esc(x.src)+'" alt="">':'<div class="ph0">'+esc(x.label||'삽화 대기')+'</div>';
      $('mcap'+sd).textContent=sl.length>1?((c+1)+'/'+sl.length+(x.cap?' · '+x.cap:'')):(x.cap||'');
      var d=''; sl.forEach(function(_,i){ d+='<i class="'+(i===c?'on':(i<c?'done':''))+'"></i>'; });
      $('mdot'+sd).innerHTML=d;
    }
  });
  var nx='';
  ['L','R'].forEach(function(sd){
    var sl=monSlides(p,sd), c=monCur(sl,e);
    if(sel===curIdx() && c+1<sl.length){ var r=Math.max(0,Math.ceil(sl[c+1].at-e)); if(!nx||r<nx.r) nx={r:r,sd:sd}; }
  });
  $('mnote').textContent = nx ? ('전환 '+fmt(nx.r*1000)) : '무대';
}

/* ---------------- right panel ---------------- */
function elapsedFor(p){ if(sw.acc>0||sw.run) return swMs()/1000; return Math.max(0,(now()-p.start)/1000); }
function activePhase(p){ var e=elapsedFor(p), a=0; p.ph.forEach(function(x,i){ if(x.at!==null&&e>=x.at) a=i; }); return a; }
function micText(x){
  var t;
  if(x.m==='유') t='유선 '+(x.k?'스탠드 '+x.k+'번':'마이크');
  else if(x.m==='무') t='무선 '+(x.k?x.k+'번':'마이크');
  else t='마이크 미정';
  return t+(x.note?' · '+x.note:'');
}
function render(){
  var p=D[sel], ci=curIdx(), h='', B=$('rbody');
  var live=(sel===ci)?'<span class="pill live">진행 중</span>':'';
  if(p.brk){
    var ni=sel+1<D.length?sel+1:-1;
    B.innerHTML='<div class="hd"><div><div class="k">'+kt(p.t)+' · '+p.len+'분</div><h2>휴회</h2></div>'+live+'</div>'+(ni>=0?'<div class="note">다음: '+(D[ni].no?D[ni].no+'번 ':'')+esc(D[ni].title)+' ('+kt(D[ni].t)+')</div>':'');
    return;
  }
  var a=activePhase(p), show=(pv!==null&&pv<p.ph.length)?pv:a, ph=p.ph[show];
  h+='<div class="hd"><div><div class="k">'+(p.no?'프로그램 '+p.no+' · ':'')+kt(p.t)+' · '+p.len+'분</div><h2>'+esc(p.title)+'</h2></div>'+live+'</div>';
  h+='<div class="g2"><div><div class="sec">사회자 · 연사 · 참여자</div><div class="people">';
  if(p.mc) h+='<div class="p"><span class="tag C">사회자</span><span class="nm">'+esc(p.mc)+'<span class="cg"> '+esc(p.mcc)+'</span></span><span class="mic on">'+(p.day==='b'?'무대 우측 스탠드 마이크 (전주곡·노래·휴회는 연탁)':'유선 마이크 · 번호 확인')+'</span></div>';
  if(p.who) h+='<div class="p"><span class="tag C">연사</span><span class="nm">'+esc(p.who)+'<span class="cg"> '+esc(p.cong)+'</span></span><span class="mic">중앙 연단</span></div>';
  h+='</div></div><div class="box stagebox">'+stageSvg(p)+'</div></div>';
  if(p.ppl.length){
    function card(x){ return '<div class="p"><span class="tag '+x.side+'">'+x.r+'</span><span class="nm">'+esc(x.n)+'<span class="cg"> '+esc(x.c)+'</span></span><span class="mic'+(x.m?' on':'')+'">'+micText(x)+'</span></div>'; }
    var Ls=p.ppl.filter(function(x){return x.side==='L';}), Rs=p.ppl.filter(function(x){return x.side==='R';});
    h+='<div class="sides"><div class="sd L">'+(Ls.length?'<div class="sh L">왼쪽 · 실연 '+Ls.length+'명</div>'+Ls.map(card).join(''):'')+'</div><div class="sd R">'+(Rs.length?'<div class="sh R">오른쪽 · 회견 '+Rs.length+'명</div>'+Rs.map(card).join(''):'')+'</div></div>';
  }
  if(p.aud){
    h+='<div class="aud" id="aud"><div class="ah"><b>청중 해설 참여</b><span>총 '+p.aud.items.length+'번 · 순서</span></div><div class="ord">'
      +p.aud.order.map(function(o,i){ return (i?'<em>›</em>':'')+'<span class="'+(o==='청중 참여'?'au':(o==='회견'?'iv':'dm'))+'">'+o+'</span>'; }).join('')+'</div>'
      +p.aud.items.map(function(x,i){ return '<div class="ai" data-at="'+x.at+'"><span class="at">'+fmt(x.at*1000)+'경</span><span class="aq"><b>'+esc(x.l)+'</b> '+esc(x.q)+'</span></div>'; }).join('')+'</div>';
  }
  h+='<div class="g2"><div class="box"><div class="shh"><span class="pill'+(show===a?' live':'')+'">'+(show===a?'지금 앵글':'미리보기')+'</span><b>'+ph.l+'</b></div>'+shotSvg(p,ph)+'<div class="note" style="margin-top:4px">'+ph.s+'</div></div>';
  h+='<div><div class="sec">카메라 앵글 진행 · 눌러서 미리보기</div><div class="cam" id="cam">';
  p.ph.forEach(function(x,i){
    h+='<button class="ph'+(i===a?' act':'')+(i===show&&show!==a?' pvw':'')+'" data-ph="'+i+'"><span class="at">'+(x.at===null?'신호':fmt(x.at*1000))+'</span><span><b>'+x.l+'</b><span>'+x.s+'</span>'+(x.q?'<span class="q">신호 멘트: '+esc(x.q)+'</span>':'')+'</span></button>';
  });
  h+='</div></div></div>';
  if(p.cue) h+='<div class="cue">'+esc(p.cue)+'</div>';
  if(p.list) h+='<div><div class="sec">해설 순서</div><div class="cue">'+esc(p.list)+'</div></div>';
  B.innerHTML=h;
}
$('rbody').onclick=function(e){ var b=e.target.closest('.ph'); if(!b) return; var i=+b.dataset.ph; pv=(pv===i)?null:i; render(); };

function partStr(p){
  var L=p.ppl.filter(function(x){return x.side==='L';}).length, Rn=p.ppl.filter(function(x){return x.side==='R';}).length, a=[];
  if(L) a.push('실연 '+L+'명(왼쪽)'); if(Rn) a.push('회견자 '+Rn+'명(오른쪽)');
  return a.join(', ');
}
function partNames(p){
  var L=p.ppl.filter(function(x){return x.side==='L';}).map(function(x){return x.n;}), Rn=p.ppl.filter(function(x){return x.side==='R';}).map(function(x){return x.n;}), a=[];
  if(L.length) a.push('실연 '+L.join('·')); if(Rn.length) a.push('회견자 '+Rn.join('·'));
  return a.join(' / ');
}
/* next-program footer (skeleton is built once per program so taps are not interrupted by the clock refresh) */

  var q=D[ni];

    footKey=ni;

    f.innerHTML='<button class="nx" id="nxbtn"><div class="sec">다음 프로그램 · '+kt(q.t)+' 시작</div><div class="n">'+(q.no?q.no+'. ':'')+esc(q.title)+'</div><div class="s">'+(q.who?esc(q.who)+' · '+esc(q.cong):(q.mc?'사회 '+esc(q.mc):''))+cnt+'</div></button>'
     +'<div class="cd"><div class="big" id="fcd">00:00</div><div class="s" id="ftx"></div></div><div class="cdbar"><i id="fbar"></i></div>';
    $('nxbtn').onclick=function(){ sel=ni; follow=(ni===curIdx()); pv=null; if(D[ni].pg!==pg) setPage(D[ni].pg); else scrollNeeded=true; render(); tick(true); };
  }
  var rem=Math.max(0,q.start-n), total=(ci>=0?D[ci].len*60000:30*60000), pct=Math.min(100,rem/total*100), low=rem<60000;
  $('fcd').textContent=fmt(rem); $('fcd').className='big'+(low?' low':'');
  $('ftx').textContent=rem>=3600000?(Math.floor(rem/3600000)+'시간 '+Math.floor(rem%3600000/60000)+'분 남음'):('약 '+Math.ceil(rem/60000)+'분 남음');
  $('fbar').style.width=pct+'%'; $('fbar').style.background=low?'var(--warn)':'var(--accent)';

/* compact (phone) view: one program card + next program at the bottom; tap next to step forward, tap back to return to live */
var mview=null, miniKey=null;
function updateMini(){
  var ci=curIdx(), ni=nextIdx(), n=now(), M=$('mini');
  var idx=(mview!==null)?mview:(ci>=0?ci:ni);
  if(idx<0){ if(miniKey!=='end'){ miniKey='end'; M.innerHTML='<div class="mmain"><div class="m2">프로그램이 모두 끝났습니다.</div></div>'; } return; }
  var p=D[idx], q=(idx+1<D.length&&D[idx+1].day===p.day)?D[idx+1]:null, key=idx+'|'+(mview!==null);
  if(miniKey!==key){
    miniKey=key;
    var e=new Date(p.end), who=p.who?'<b>'+esc(p.who)+'</b> · '+esc(p.cong):(p.mc?'사회 <b>'+esc(p.mc)+'</b>':'');
    var tabs='<div class="mtabs" role="tablist">'+PAGES.map(function(g){ return '<button class="mtab" role="tab" data-k="'+g.k+'" aria-selected="'+(g.k===p.pg?'true':'false')+'"><span>'+g.d+'</span><b>'+g.s+'</b></button>'; }).join('')+'</div>';
    var ps=partStr(p), pn=partNames(p), qs=q?partStr(q):'';
    M.innerHTML=tabs+'<div class="mmain"><div class="mtop"><span class="pill" id="mpill">-</span>'+(mview!==null?'<button class="mback" id="mback">↩ 지금으로 돌아가기</button>':'')+'</div>'
      +'<h2>'+(p.no?p.no+'. ':'')+esc(p.title)+'</h2>'
      +'<div class="m2">'+kt(p.t)+' ~ '+kt(pad(e.getHours())+':'+pad(e.getMinutes()))+' · '+p.len+'분</div>'
      +'<div class="m2">'+who+(ps?' <span class="pi">('+ps+')</span>':'')+(p.aud?' <span class="achip">청중 참여 '+p.aud.items.length+'회</span>':'')+'</div>'+(pn?'<div class="m3">'+esc(pn)+'</div>':'')
      +'<div class="mbar"><i id="mbar"></i></div>'
      +'<div class="mrow"><span id="mbl"></span><b class="big" id="mbig">00:00</b><span id="mpc"></span></div></div>'
      +(q?'<button class="mnext" data-i="'+(idx+1)+'"><span class="sec">다음 프로그램 · '+kt(q.t)+' 시작 ›</span><b>'+(q.no?q.no+'. ':'')+esc(q.title)+'</b><span class="m2">'+(q.who?esc(q.who)+' · '+esc(q.cong):(q.mc?'사회 '+esc(q.mc):''))+(qs?' <span class="pi">('+qs+')</span>':'')+'</span><span class="mncd" id="mncd"></span></button>'
          :'<div class="mnext end"><span class="sec">다음 프로그램</span><b>없음 · 오늘 마지막 프로그램</b></div>');
  }
  var st, bl, big, pct;
  if(n<p.start){ st=(mview===null)?'다음 프로그램':'예정'; bl='시작까지'; big=p.start-n; pct=0; }
  else if(n>=p.end){ st='종료'; bl='종료됨'; big=0; pct=100; }
  else { st='진행 중'; bl='남은 시간'; big=p.end-n; pct=Math.min(100,(n-p.start)/(p.end-p.start)*100); }
  $('mpill').textContent=st; $('mpill').className='pill'+(st==='진행 중'?' live':'');
  $('mbl').textContent=bl; $('mbig').textContent=fmt(Math.max(0,big)); $('mbig').className='big'+(big<60000&&n<p.end?' low':'');
  $('mbar').style.width=pct+'%'; $('mpc').textContent=(st==='진행 중')?Math.floor(pct)+'%':'';
  if(q){ var r=q.start-n; $('mncd').textContent=r>0?('시작까지 '+fmt(r)):(n<q.end?'진행 중':'종료'); }
}
$('mini').onclick=function(e){
  var t=e.target.closest('.mtab');
  if(t&&t.dataset.k){
    var ci=curIdx(), k=t.dataset.k, first=-1, i;
    for(i=0;i<D.length;i++) if(D[i].pg===k){ first=i; break; }
    mview=(ci>=0&&D[ci].pg===k)?null:first; miniKey=null; updateMini(); return;
  }
  var b=e.target.closest('.mnext');
  if(b&&b.dataset.i){ mview=+b.dataset.i; miniKey=null; updateMini(); return; }
  if(e.target.closest('.mback')){ mview=null; miniKey=null; updateMini(); }
};

/* ---------------- main loop ---------------- */
var lastA=-1,lastSel=-1;
function tick(force){
  var n=new Date(now()), ci=curIdx();
  var h=n.getHours();
  $('clock').innerHTML='<span class="ap">'+(h<12?'오전':'오후')+'</span>'+pad(h%12||12)+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
  $('date').textContent=n.getFullYear()+'.'+pad(n.getMonth()+1)+'.'+pad(n.getDate())+' ('+'일월화수목금토'.charAt(n.getDay())+')';
  if(follow&&ci>=0&&sel!==ci){ sel=ci; pv=null; if(D[ci].pg!==pg) setPage(D[ci].pg); else scrollNeeded=true; render(); }
  var p=D[sel], ms=swMs(), target=p.len*60000;
  $('swname').textContent=(p.no?p.no+'. ':'')+p.title;
  $('swtarget').textContent=pad(p.len)+':00';
  var s=$('sw'); s.textContent=(ms>target?'+':'')+fmt(ms>target?ms-target:ms);
  s.classList.toggle('over',ms>target); s.classList.toggle('run',sw.run&&ms<=target);
  $('swbar').style.width=Math.min(100,ms/target*100)+'%';
  $('swbar').style.background=ms>target?'var(--warn)':'var(--accent)';
  $('start').textContent=sw.run?'정지':(ms>0?'계속':'시작'); $('start').className='btn '+(sw.run?'stop':'go');
  if(!p.brk){ var a=activePhase(p); if(a!==lastA||sel!==lastSel||force){ if(sel!==lastSel) pv=null; lastA=a; lastSel=sel; render(); } }
  updateRows(); updateMons(); updateAud(); updateFoot(); updateMini();
}

$('start').onclick=function(){ if(sw.run){ sw.acc+=Date.now()-sw.t0; sw.run=false; } else { sw.t0=Date.now(); sw.run=true; } tick(); };
$('reset').onclick=function(){ sw={run:false,t0:0,acc:0}; tick(true); };
/* theme (dark / light) */
(function(){
  var b=$('thm'), de=document.documentElement, mt=document.querySelector('meta[name="color-scheme"]');
  function apply(t,save){
    if(t==='light') de.setAttribute('data-theme','light'); else de.removeAttribute('data-theme');
    b.textContent=(t==='light')?'어둡게':'밝게';
    if(mt) mt.setAttribute('content',t==='light'?'light':'dark');
    if(save){ try{ localStorage.setItem('theme',t); }catch(e){} }
    if(sel!==null) render();
  }
  var t='dark'; try{ t=localStorage.getItem('theme')||'dark'; }catch(e){}
  apply(t==='light'?'light':'dark',false);
  b.onclick=function(){ apply(de.getAttribute('data-theme')==='light'?'dark':'light',true); };
})();
/* fullscreen */
(function(){
  var el=document.documentElement, b=$('fs');
  var req=el.requestFullscreen||el.webkitRequestFullscreen, ex=document.exitFullscreen||document.webkitExitFullscreen;
  function isFs(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  function sync(){ b.textContent=isFs()?'전체화면 끄기':'전체화면'; }
  b.classList.add('fsb');
  b.onclick=function(){
    try{
      if(isFs()){ ex.call(document); return; }
      if(req){ var r=req.call(el); if(r&&r.catch) r.catch(hint); } else hint();
    }catch(e){ hint(); }
  };
  function hint(){ alert('이 브라우저는 전체화면 전환을 지원하지 않습니다.\n공유 버튼(□↑) → "홈 화면에 추가"로 추가한 뒤 그 아이콘으로 열면 주소창 없이 전체화면으로 보입니다.'); }
  document.addEventListener('fullscreenchange',sync); document.addEventListener('webkitfullscreenchange',sync);
})();
$('demo').onclick=function(){
  var k=demoIdx+1; k=(k+1)%(PRESETS.length+1); demoIdx=k-1;
  if(demoIdx>=0){ demoBase=PRESETS[demoIdx].t; demoStart=Date.now(); }
  this.setAttribute('aria-pressed',demoIdx>=0?'true':'false');
  this.textContent=demoIdx>=0?('시연 · '+PRESETS[demoIdx].l):'시연 모드';
  sw={run:false,t0:0,acc:0}; follow=true; pv=null; sel=pickSel(); setPage(D[sel].pg); render(); tick(true);
};

/* resizable top panel */
(function(){
  var top=$('top'), sp=$('split'), col=$('left'), drag=false;
  try{ var v=localStorage.getItem('topH'); if(v) top.style.setProperty('--topH',v+'px'); }catch(e){}
  function setH(y){ var r=col.getBoundingClientRect(); var h=Math.max(120,Math.min(r.height-200,y-r.top)); top.style.setProperty('--topH',h+'px'); try{localStorage.setItem('topH',h);}catch(e){} }
  sp.addEventListener('pointerdown',function(e){drag=true;sp.setPointerCapture(e.pointerId);});
  sp.addEventListener('pointermove',function(e){if(drag) setH(e.clientY);});
  sp.addEventListener('pointerup',function(){drag=false;});
  sp.addEventListener('keydown',function(e){ var h=top.getBoundingClientRect().height, t=col.getBoundingClientRect().top; if(e.key==='ArrowDown') setH(t+h+20); if(e.key==='ArrowUp') setH(t+h-20); });
})();

buildTabs(); sel=pickSel(); setPage(D[sel].pg); render(); tick(true);
setInterval(tick,250);
</script>
</body></html>
